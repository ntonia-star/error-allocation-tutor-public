services:
  - type: web
    name: error-allocation-tutor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "40"
